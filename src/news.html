<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News &amp; Insights — MATRIX Lift</title>
  <meta name="description" content="Company updates, technical insights and announcements from MATRIX Lift.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="./output.css" rel="stylesheet">
</head>
<body data-page="news">
  <div id="header-slot"></div>
  <main>
    <div id="hero"></div>
    <section class="relative overflow-hidden bg-sky py-10 lg:py-20">
      <div class="bg-blueprint absolute inset-0 mask-fade-y opacity-60"></div>
      <div class="container-x relative">
        <a id="featured" class="group grid gap-2 overflow-hidden rounded-[30px] bg-white p-2.5 ring-1 ring-ink-900/7 shadow-[0_30px_60px_-36px_rgba(12,27,51,.45)] lg:grid-cols-2" data-reveal></a>
        <div id="list" class="mt-10 grid gap-5 md:grid-cols-2 lg:grid-cols-3" data-stagger></div>
      </div>
    </section>
  </main>
  <div id="footer-slot"></div>
  <script src="js/data.js"></script>
  <script src="js/render.js"></script>
  <script>
    document.getElementById("hero").innerHTML = R.pageHero({ eyebrow: "News & insights", big: "News", cap: "& Insights", title: "", text: "Company news, leadership messages and updates from MATRIX.", crumbs: [{ label: "News" }], side: `<div class="flex items-center justify-between"><p class="font-mono text-[11px] uppercase tracking-[0.18em] text-brand-300">Latest</p><span class="led rounded-lg bg-ink-950 px-2.5 py-1 font-mono text-xs">▲ FLR 01</span></div><div class="mt-6 space-y-3">${ML.news.map((n) => `<a href="article.html?a=${n.slug}" class="group flex items-center gap-4 rounded-2xl bg-white/[.06] p-3 ring-1 ring-white/10 transition hover:bg-white/[.1]"><span class="size-16 shrink-0 overflow-hidden rounded-xl bg-white"><img src="${n.img}" alt="" class="size-full ${n.fit === "portrait" ? "object-contain object-bottom" : "object-cover"}"></span><span class="min-w-0"><span class="block font-mono text-[10.5px] uppercase tracking-[0.16em] text-brand-300">${n.cat}</span><span class="mt-1 block text-[14.5px] font-semibold leading-snug group-hover:text-brand-300">${n.title}</span></span></a>`).join("")}</div>` });
    const [f, ...rest] = ML.news;
    const fe = document.getElementById("featured");
    fe.href = `article.html?a=${f.slug}`;
    fe.innerHTML = `
      <div class="img-zoom relative aspect-[16/10] overflow-hidden rounded-[22px] lg:aspect-auto lg:min-h-[440px] ${f.fit === "portrait" ? "bg-gradient-to-br from-mint via-sky to-sand" : ""}">${f.fit === "portrait" ? `<div class="bg-floors absolute inset-0 opacity-50"></div><img src="${f.img}" alt="" class="absolute inset-x-0 bottom-0 mx-auto h-[94%] w-auto object-contain mix-blend-multiply">` : `<img src="${f.img}" alt="" class="size-full object-cover">`}</div>
      <div class="flex flex-col justify-center p-8 lg:p-14">
        <div class="flex flex-wrap items-center gap-2"><span class="eyebrow">Featured</span><span class="font-mono text-[11px] uppercase tracking-[0.14em] text-ink-400">${f.cat} · ${f.date}</span></div>
        <h2 class="mt-5 font-display text-[2rem] font-semibold leading-[1.1] tracking-tight text-ink-900 transition group-hover:text-brand-600 sm:text-[2.5rem]">${f.title}</h2>
        <p class="lead mt-4">${f.excerpt}</p>
        <span class="mt-8 inline-flex items-center gap-2 text-[14px] font-semibold text-ink-900">Read article ${ML.icon("arrow", "size-4 transition group-hover:translate-x-1")}</span>
      </div>`;
    R.fill("list", rest.map(R.newsCard));
  </script>
  <script src="js/main.js"></script>
</body>
</html>
