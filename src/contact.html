<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact &amp; Request a Quote — MATRIX Lift</title>
  <meta name="description" content="Contact MATRIX Lift, DOHS Mirpur, Dhaka. Request a quote for lifts, escalators, moving walks, parking systems and maintenance.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="./output.css" rel="stylesheet">
</head>
<body data-page="contact">
  <div id="header-slot"></div>
  <main>
    <div id="hero"></div>
    <section id="quote" class="relative scroll-mt-24 overflow-hidden bg-mint py-12 lg:py-22">
      <div class="bg-dots absolute inset-0 mask-radial opacity-70"></div>
      <div class="container-x relative grid gap-10 lg:grid-cols-12">
        <div class="card p-6 sm:p-10 lg:col-span-7" data-reveal="left">
          <h2 class="font-display text-[2rem] font-semibold tracking-tight">Request a <em>quote</em></h2>
          <p class="mt-2 text-ink-500">Fields marked * are required. We typically reply within business hours.</p>
          
          <div id="form" class="mt-8"></div>
        </div>
        <aside class="space-y-4 lg:col-span-5" data-reveal="right">
          <div id="contact-cards" class="grid gap-3 sm:grid-cols-2"></div>
          <div class="relative overflow-hidden rounded-[26px] bg-white p-8 ring-1 ring-ink-900/7">
            <div class="bg-blueprint absolute inset-0 opacity-70"></div>
            <div class="relative">
              <p class="eyebrow">Office location</p>
              <p class="mt-4 font-display text-[26px] font-semibold tracking-tight">DOHS Mirpur, <em>Dhaka</em></p>
              <p class="mt-2 text-[14.5px] leading-relaxed text-ink-600">DDL Sranti Villa, Flat # A/1 (West), House # 1031/33, Road # 9, Avenue # 9, DOHS Mirpur, Dhaka 1216</p>
              <div class="mt-6 overflow-hidden rounded-2xl ring-1 ring-ink-900/10"><iframe title="MATRIX Lift office map" src="https://www.google.com/maps?q=DOHS+Mirpur+Avenue+9+Road+9+Dhaka+1216&output=embed" class="aspect-[16/10] w-full" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>
            </div>
          </div>
          <p class="text-xs leading-relaxed text-ink-500">Your details are used only to respond to your enquiry.</p>
          
        </aside>
      </div>
    </section>
  </main>
  <div id="footer-slot"></div>
  <script src="js/data.js"></script>
  <script src="js/render.js"></script>
  <script>
    const { contact, icon } = ML;
    document.getElementById("hero").innerHTML = R.pageHero({ eyebrow: "Contact", big: "Lifting", cap: "is our passion", title: "", text: "DDL Sranti Villa, Flat # A/1 (West), House # 1031/33, Road # 9, Avenue # 9, DOHS Mirpur, Dhaka 1216.", crumbs: [{ label: "Contact" }], side: `<div class="flex items-center justify-between"><p class="font-mono text-[11px] uppercase tracking-[0.18em] text-brand-300">Reach us directly</p><span class="led rounded-lg bg-ink-950 px-2.5 py-1 font-mono text-xs">▲ FLR 01</span></div><div class="mt-6 space-y-3"><a href="${ML.contact.phoneHref}" class="group flex items-center gap-4 rounded-2xl bg-white/[.06] p-4 ring-1 ring-white/10 transition hover:bg-white/[.1]"><span class="grid size-11 shrink-0 place-items-center rounded-xl bg-brand-500 text-white">${ML.icon("phone", "size-5")}</span><span class="min-w-0"><span class="block font-mono text-[10.5px] uppercase tracking-[0.16em] text-white/50">Hotline</span><span class="block truncate text-[15.5px] font-semibold">${ML.contact.phone}</span></span></a><a href="${ML.contact.phone2Href}" class="group flex items-center gap-4 rounded-2xl bg-white/[.06] p-4 ring-1 ring-white/10 transition hover:bg-white/[.1]"><span class="grid size-11 shrink-0 place-items-center rounded-xl bg-brand-500 text-white">${ML.icon("phone", "size-5")}</span><span class="min-w-0"><span class="block font-mono text-[10.5px] uppercase tracking-[0.16em] text-white/50">Mobile</span><span class="block truncate text-[15.5px] font-semibold">${ML.contact.phone2}</span></span></a><a href="mailto:${ML.contact.email}" class="group flex items-center gap-4 rounded-2xl bg-white/[.06] p-4 ring-1 ring-white/10 transition hover:bg-white/[.1]"><span class="grid size-11 shrink-0 place-items-center rounded-xl bg-brand-500 text-white">${ML.icon("mail", "size-5")}</span><span class="min-w-0"><span class="block font-mono text-[10.5px] uppercase tracking-[0.16em] text-white/50">Email</span><span class="block truncate text-[15.5px] font-semibold">${ML.contact.email}</span></span></a><a href="#quote" class="group flex items-center gap-4 rounded-2xl bg-white/[.06] p-4 ring-1 ring-white/10 transition hover:bg-white/[.1]"><span class="grid size-11 shrink-0 place-items-center rounded-xl bg-brand-500 text-white">${ML.icon("clock", "size-5")}</span><span class="min-w-0"><span class="block font-mono text-[10.5px] uppercase tracking-[0.16em] text-white/50">Office hours</span><span class="block truncate text-[15.5px] font-semibold">${ML.contact.hours}</span></span></a></div><p class="mt-5 flex items-center gap-2 text-[13.5px] text-white/70"><span class="size-2 rounded-full bg-brand-400 shadow-[0_0_10px] shadow-brand-400"></span>24/7 maintenance &amp; after-sales service</p>` });
    document.getElementById("form").innerHTML = R.quoteForm(new URLSearchParams(location.search).get("product") || "");
    const cards = [
      ["phone", "Hotline", contact.phone, contact.phoneHref],
      ["phone", "Mobile", contact.phone2, contact.phone2Href],
      ["mail", "Email", contact.email, "mailto:" + contact.email],
      ["mail", "Alternate email", contact.email2, "mailto:" + contact.email2],
    ];
    R.fill("contact-cards", cards.map(([ic, k, v, h], i) => `
      <${h ? `a href="${h}"` : "div"} class="card group flex items-center gap-4 p-4 ${i > 1 ? "sm:col-span-2" : ""} ${h ? "transition hover:-translate-y-0.5 hover:border-brand-400" : ""}">
        <span class="grid size-12 shrink-0 place-items-center rounded-2xl bg-mint text-brand-600 transition group-hover:bg-brand-400 group-hover:text-ink-950">${icon(ic)}</span>
        <span class="min-w-0"><span class="block text-xs uppercase tracking-wider text-ink-500">${k}</span><span class="mt-0.5 block break-words text-[14.5px] font-semibold [overflow-wrap:anywhere]">${v}</span></span>
      </${h ? "a" : "div"}>`));
  </script>
  <script src="js/main.js"></script>
</body>
</html>
